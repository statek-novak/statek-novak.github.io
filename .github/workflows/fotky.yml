name: Aktualizovat seznam fotek a PDF

on:
  push:
    paths:
      - 'img/**'
      - 'publicita/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fotky
  cancel-in-progress: false

jobs:
  generuj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: pip install pymupdf

      - run: python prevod-pdf.py

      - run: node generuj-seznamy.js

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A fotky.js publicita.js publicita
          if git diff --cached --quiet; then
            echo "Beze změny."
          else
            git commit -m "Aktualizace seznamu fotek a PDF"
            git push
          fi
